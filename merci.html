<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Merci | NEXO Entretien Commercial</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #062746;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .confirmation {
      background: white;
      max-width: 650px;
      width: 100%;
      padding: 55px 45px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 30px;
    }

    .check {
      width: 65px;
      height: 65px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #eaf4fc;
      color: #1379d3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      color: #062746;
      font-size: 34px;
      margin-bottom: 18px;
    }

    p {
      color: #66717c;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 26px;
      background: #1379d3;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 7px;
    }

    .btn:hover {
      background: #0d66b5;
    }

    .contact {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #e2e7eb;
      font-size: 14px;
      color: #7b8792;
    }

    @media (max-width: 600px) {
      .confirmation {
        padding: 40px 25px;
      }

      h1 {
        font-size: 28px;
      }

      .logo {
        width: 115px;
      }
    }
  </style>
</head>

<body>

  <div class="confirmation">

    <img
      src="logo-nexo1.png"
      alt="NEXO Entretien Commercial"
      class="logo"
    >

    <div class="check">✓</div>

    <h1>Merci!</h1>

    <p>
      <strong>Votre demande de soumission a bien été envoyée.</strong>
    </p>

    <p>
      Nous avons reçu vos informations.
      Un membre de l'équipe NEXO communiquera avec vous prochainement
      afin de discuter de vos besoins.
    </p>

    <a href="/" class="btn">
      Retour à l'accueil
    </a>

    <div class="contact">
      NEXO Entretien Commercial<br>
      514-448-7347<br>
      nexoentretien.sa@gmail.com
    </div>

  </div>

</body>
</html>
